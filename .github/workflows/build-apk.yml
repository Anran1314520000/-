name: Build MR Plan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ✅ 换更稳的安卓SDK安装方式，避开之前反复出错的授权
      - name: Install Android SDK and accept licenses
        run: |
          sudo apt update
          sudo apt install -y unzip
          # 自动同意许可，不再单独用yes | sdkmanager --licenses（这个很容易卡死）
          mkdir -p ~/.android
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fb4" > ~/.android/repositories.cfg
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip -d cmdline-tools
          sudo mkdir -p /opt/android-sdk/cmdline-tools/latest
          sudo mv cmdline-tools/cmdline-tools/* /opt/android-sdk/cmdline-tools/latest/
          export ANDROID_HOME=/opt/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          sdkmanager --update
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/mr-src"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/mr-src"

          PROJECT_DIR="$(find "$RUNNER_TEMP/mr-src" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle Android project found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "ERROR: Gradle wrapper gradlew not found. This project needs a Gradle wrapper or a compatible Gradle installation."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MR-plan-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
